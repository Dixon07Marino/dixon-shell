:root {
  --bg: #0d1117;
  --bg-raised: #12181f;
  --surface: #161b22;
  --surface-2: #1c232c;
  --border: #262d38;
  --border-soft: #1d2530;
  --text: #c9d1d9;
  --text-dim: #7d8895;
  --text-faint: #4d5560;
  --accent: #4ade80;
  --accent-dim: #2f9f5e;
  --accent-glow: rgba(74, 222, 128, 0.14);
  --amber: #e8a445;
  --amber-dim: #a97530;
  --amber-glow: rgba(232, 164, 69, 0.14);
  --red: #f0665a;
  --blue: #6cb2f4;
  --violet: #b592f5;
  --shadow: rgba(0, 0, 0, 0.45);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117;
    --bg-raised: #12181f;
    --surface: #161b22;
    --surface-2: #1c232c;
    --border: #262d38;
    --border-soft: #1d2530;
    --text: #c9d1d9;
    --text-dim: #7d8895;
    --text-faint: #4d5560;
    --accent: #4ade80;
    --accent-dim: #2f9f5e;
    --accent-glow: rgba(74, 222, 128, 0.14);
    --amber: #e8a445;
    --amber-dim: #a97530;
    --amber-glow: rgba(232, 164, 69, 0.14);
    --red: #f0665a;
    --blue: #6cb2f4;
    --violet: #b592f5;
    --shadow: rgba(0, 0, 0, 0.45);
  }
}

:root[data-theme="dark"] {
  --bg: #0d1117;
  --bg-raised: #12181f;
  --surface: #161b22;
  --surface-2: #1c232c;
  --border: #262d38;
  --border-soft: #1d2530;
  --text: #c9d1d9;
  --text-dim: #7d8895;
  --text-faint: #4d5560;
  --accent: #4ade80;
  --accent-dim: #2f9f5e;
  --accent-glow: rgba(74, 222, 128, 0.14);
  --amber: #e8a445;
  --amber-dim: #a97530;
  --amber-glow: rgba(232, 164, 69, 0.14);
  --red: #f0665a;
  --blue: #6cb2f4;
  --violet: #b592f5;
  --shadow: rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

body {
  font-family: 'Plex', ui-monospace, 'SF Mono', Consolas, monospace;
  font-size: 15px;
  line-height: 1.6;
  background-image:
    radial-gradient(ellipse 800px 400px at 15% -5%, var(--accent-glow), transparent 60%),
    radial-gradient(ellipse 600px 500px at 100% 10%, var(--amber-glow), transparent 55%);
  background-attachment: fixed;
}

::selection { background: var(--accent-dim); color: #06110a; }

a { color: var(--accent); }

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 48px 24px 96px;
}

/* ---------- HERO / BOOT SEQUENCE ---------- */

.hero {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 10px;
  box-shadow: 0 20px 50px -25px var(--shadow);
  overflow: hidden;
  margin-bottom: 56px;
}

.hero-titlebar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--bg-raised);
  border-bottom: 1px solid var(--border);
}

.dot { width: 11px; height: 11px; border-radius: 50%; }
.dot.r { background: #ff5f56; }
.dot.y { background: #ffbd2e; }
.dot.g { background: #27c93f; }

.hero-titlebar span.label {
  margin-left: 10px;
  font-size: 12px;
  color: var(--text-faint);
  letter-spacing: 0.03em;
}

.hero-body {
  padding: 32px 28px 34px;
  min-height: 190px;
  position: relative;
}

.hero-mark {
  position: absolute;
  top: 28px;
  right: 28px;
  width: 26px;
  height: 26px;
}

.boot-line {
  white-space: pre-wrap;
  word-break: break-word;
}

.boot-line .prompt { color: var(--accent); }
.boot-line .path { color: var(--blue); }
.boot-line .out { color: var(--text-dim); }
.boot-line .name {
  font-family: 'JBM', monospace;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
}

.cursor {
  display: inline-block;
  width: 8px;
  height: 1.1em;
  background: var(--accent);
  vertical-align: text-bottom;
  margin-left: 2px;
  animation: blink 1s steps(1) infinite;
}

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

.tagline {
  margin-top: 18px;
  font-family: 'JBM', monospace;
  font-size: clamp(24px, 4vw, 34px);
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
  text-wrap: balance;
  opacity: 0;
}

.tagline .accent { color: var(--accent); }
.tagline .amber-t { color: var(--amber); }

.sub {
  margin-top: 10px;
  color: var(--text-dim);
  font-size: 14.5px;
  max-width: 60ch;
  opacity: 0;
}

/* ---------- TIP OF THE MOMENT ---------- */

.tip-panel {
  border: 1px solid var(--border);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border-radius: 10px;
  margin-bottom: 56px;
  overflow: hidden;
  box-shadow: 0 20px 50px -30px var(--shadow);
}

.tip-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-soft);
}

.tip-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.tip-eyebrow {
  font-family: 'JBM', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--amber);
}

.tip-blink {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 8px var(--amber);
  animation: pulse 2s ease-in-out infinite;
}

.claude-mark {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  color: var(--accent);
  filter: drop-shadow(0 0 4px var(--accent-glow));
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

.tip-nav {
  display: flex;
  gap: 6px;
}

.tip-nav button {
  font-family: 'Plex', monospace;
  font-size: 12px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 5px;
  padding: 4px 9px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}

/* Code above, description below — commands in any module can run

<script>
(function () {
  "use strict";

  /* ---------------- BOOT SEQUENCE ---------------- */
  var bootLines = [
    { p: "dixon@core", path: "~", cmd: "whoami" },
    { out: "dixon" },

  ];

  var bootOut = document.getElementById("bootOut");
  var tagline = document.getElementById("tagline");
  var subline = document.getElementById("subline");

  function typeLine(text, el, speed, cb) {
    var i = 0;
    (function step() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(step, speed);
      } else if (cb) { cb(); }
    })();
  }

  function renderBoot() {
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) {
      bootOut.innerHTML =
        '<div class="boot-line"><span class="prompt">dixon@core</span> <span class="path">~</span> $ whoami</div>' +
        '<div class="boot-line out">dixon</div>' +
        '<div class="boot-line"><span class="prompt">dixon@core</span> <span class="path">~</span> $ echo $STATUS</div>' +
        '<div class="boot-line out">building things, breaking prod occasionally</div>';
      tagline.style.opacity = 1;
      subline.style.opacity = 1;
      return;
    }

    var seq = [
      { type: "prompt", text: "dixon@core ~ $ whoami" },
      { type: "out", text: "dixon" },
      { type: "prompt", text: "dixon@core ~ $ echo $STATUS" },
      { type: "out", text: "building things, breaking prod occasionally" }
    ];

    var idx = 0;
    function next() {
      if (idx >= seq.length) {
        tagline.style.transition = "opacity 0.5s ease";
        subline.style.transition = "opacity 0.5s ease 0.15s";
        requestAnimationFrame(function () {
          tagline.style.opacity = 1;
          subline.style.opacity = 1;
        });
        return;
      }
      var item = seq[idx];
      var div = document.createElement("div");
      div.className = "boot-line" + (item.type === "out" ? " out" : "");
      bootOut.appendChild(div);

      if (item.type === "prompt") {
        var parts = item.text.split(" $ ");
        typeLine(parts[0] + " $ " + parts[1], div, 16, function () {
          idx++;
          setTimeout(next, 120);
        });
      } else {
        div.textContent = item.text;
        idx++;
        setTimeout(next, 220);
      }
    }
    next();
  }
  renderBoot();

  /* ---------------- TIPS ---------------- */
  var TIPS = [
    { cat: "git", color: "accent", text: "`git switch -` vuelve a la rama anterior, igual que `cd -` en la shell. Ahorra el copy-paste del nombre de rama." },
    { cat: "git", color: "accent", text: "`git commit --fixup=<hash>` crea un commit marcado para squash automático con `git rebase -i --autosquash`. Ideal para arreglar un commit viejo sin romper el historial." },
    { cat: "git", color: "accent", text: "`git restore --staged <file>` saca un archivo del stage sin tocar sus cambios. Es el reemplazo moderno de `git reset HEAD <file>`." },
    { cat: "git", color: "accent", text: "Usa `git log --oneline --graph --all` para ver todas las ramas como árbol. Añádelo como alias y ahorras diez segundos cada vez." },
    { cat: "git", color: "accent", text: "`git stash push -m \"mensaje\"` etiqueta el stash. Sin mensaje, tres stashes después ya no sabes cuál es cuál." },
    { cat: "git", color: "accent", text: "`git bisect start` automatiza la búsqueda binaria de un commit que introdujo un bug. Marca `good`/`bad` y Git te va acercando al culpable." },
    { cat: "git", color: "accent", text: "`git worktree add ../hotfix rama` te da un segundo directorio de trabajo apuntando a otra rama, sin hacer stash ni cambiar de contexto en el actual." },
    { cat: "git", color: "accent", text: "`git reflog` guarda un historial de todo lo que hizo HEAD, incluso commits 'perdidos' tras un reset --hard. Casi nada en Git se pierde de verdad." },
    { cat: "git", color: "accent", text: "Configura `git config --global rerere.enabled true` para que Git recuerde cómo resolviste un conflicto y lo reaplique automáticamente la próxima vez." },
    { cat: "git", color: "accent", text: "`git checkout <hash>` te lleva a un commit específico en modo 'detached HEAD': puedes mirar el código de ese punto, pero si haces commits ahí y cambias de rama sin crear una nueva, los pierdes de vista." },
    { cat: "git", color: "accent", text: "Nunca uses `git push --force` en una rama compartida. Usa `--force-with-lease`: falla si alguien más subió cambios que tú no tienes, evitando pisar trabajo ajeno sin darte cuenta." },
    { cat: "git", color: "accent", text: "`git pull --rebase --autostash` guarda tus cambios locales sin commitear, actualiza la rama, y los reaplica automáticamente encima. Evita el 'stash manual antes de cada pull'." },
    { cat: "linux", color: "amber", text: "`Ctrl+R` en la terminal busca en el historial de comandos de forma interactiva. Combínalo con `fzf` para un fuzzy-search brutal." },
    { cat: "linux", color: "amber", text: "`!!` repite el último comando. `sudo !!` es el clásico cuando olvidas los permisos." },
    { cat: "linux", color: "amber", text: "`chmod +x script.sh` no reemplaza los permisos existentes, solo agrega el de ejecución. Es más seguro que `chmod 755`." },
    { cat: "linux", color: "amber", text: "`du -sh * | sort -h` lista el tamaño de cada carpeta del directorio actual, ordenado de menor a mayor. El primer comando que corres cuando el disco se llena." },
    { cat: "linux", color: "amber", text: "`trap 'echo salió' EXIT` en un script bash ejecuta limpieza incluso si el script falla a mitad de camino." },
    { cat: "linux", color: "amber", text: "`journalctl -u servicio -f` sigue en vivo los logs de un servicio systemd, equivalente a `tail -f` pero para el sistema de logs moderno." },
    { cat: "linux", color: "amber", text: "`command1 | tee archivo.log | command2` te deja ver la salida en pantalla Y guardarla en archivo, sin perder el pipe hacia el siguiente comando." },
    { cat: "linux", color: "amber", text: "Usa `set -euo pipefail` al inicio de tus scripts bash: falla rápido ante errores, variables no definidas y fallos ocultos dentro de un pipe." },
    { cat: "linux", color: "amber", text: "`lsof -i :8080` te dice exactamente qué proceso está usando un puerto. Es el primer comando cuando algo falla con 'address already in use'." },
    { cat: "linux", color: "amber", text: "Si `df -h` muestra espacio libre pero igual falla 'no space left on device', revisa `df -i`: puede que te hayas quedado sin inodos, no sin bytes." },
    { cat: "docker", color: "blue", text: "`docker system prune -a --volumes` libera espacio agresivamente, pero borra TODO lo no usado. Revisa antes de correrlo en un host compartido." },
    { cat: "docker", color: "blue", text: "Usa `.dockerignore` como usarías `.gitignore`. Sin él, tu build envía `node_modules` completo al daemon." },
    { cat: "docker", color: "blue", text: "`docker exec -it <container> sh` te mete dentro del contenedor corriendo, sin reiniciar nada. Útil para debug en caliente." },
    { cat: "docker", color: "blue", text: "Multi-stage builds: usa una imagen `builder` para compilar y copia solo el binario final a una imagen `slim`. Reduce el tamaño en 10x fácilmente." },
    { cat: "docker", color: "blue", text: "`docker compose watch` reconstruye y sincroniza servicios automáticamente al detectar cambios en el código, sin reiniciar todo el stack." },
    { cat: "docker", color: "blue", text: "Ordena las instrucciones del Dockerfile de menos a más cambiantes (dependencias antes que código fuente) para aprovechar el cache de capas al máximo." },
    { cat: "docker", color: "blue", text: "`HEALTHCHECK` en el Dockerfile permite que Docker (y Compose) sepan si tu contenedor está realmente listo, no solo 'corriendo'." },
    { cat: "docker", color: "blue", text: "Un contenedor que se reinicia solo (`Restarting`) casi siempre murió justo al arrancar. Corre `docker logs id` antes que cualquier otra cosa — ahí está la causa real." },
    { cat: "sql", color: "violet", text: "En PostgreSQL, `EXPLAIN (ANALYZE, BUFFERS)` muestra el plan real de ejecución con tiempos y uso de caché — el primer paso para optimizar cualquier query lenta." },
    { cat: "sql", color: "violet", text: "Un índice no ayuda si la columna está envuelta en una función (`WHERE lower(email) = ...`). Usa un índice de expresión: `CREATE INDEX ON tabla (lower(email))`." },
    { cat: "sql", color: "violet", text: "`VACUUM` no compacta el archivo en disco por defecto, solo marca espacio como reutilizable. Para recuperar espacio real necesitas `VACUUM FULL` (bloquea la tabla)." },
    { cat: "sql", color: "violet", text: "Usa `SERIAL` casi nunca en proyectos nuevos: `GENERATED ALWAYS AS IDENTITY` es el estándar SQL moderno y evita huecos raros al restaurar backups." },
    { cat: "sql", color: "violet", text: "Un índice compuesto `(a, b)` sirve para filtros por `a` o por `a AND b`, pero no ayuda a un filtro que solo use `b`. El orden de las columnas importa." },
    { cat: "sql", color: "violet", text: "`JSONB` en Postgres indexa y consulta mejor que `JSON` porque almacena en formato binario. Casi siempre es la opción correcta salvo que necesites preservar el texto exacto." },
    { cat: "sql", color: "violet", text: "Antes de un `UPDATE` o `DELETE` grande, prueba el mismo `WHERE` con un `SELECT` primero. Cuesta un segundo y evita corregir un desastre en producción." },
    { cat: "claude", color: "amber", text: "Dale a Claude Code contexto de una vez, no en fragmentos: pégale el error completo, el archivo relevante y qué ya intentaste. Menos idas y vueltas." },
    { cat: "claude", color: "amber", text: "Usa CLAUDE.md en la raíz del proyecto para fijar convenciones (estilo, comandos de test, arquitectura). Claude lo lee automáticamente en cada sesión." },
    { cat: "claude", color: "amber", text: "Pide primero un plan antes de una tarea grande ('no escribas código todavía, dime tu approach'). Corregir un plan es más barato que corregir código ya escrito." },
    { cat: "claude", color: "amber", text: "Los subagentes (Explore, Plan) sirven para investigar sin llenar tu contexto principal de resultados de búsqueda. Úsalos para exploración amplia, no para tareas triviales." },
    { cat: "claude", color: "amber", text: "Si Claude Code va por mal camino, no sigas corrigiendo en la misma conversación larga — a veces es más rápido cortar y reiniciar con un prompt más claro." },
    { cat: "claude", color: "amber", text: "Pide explícitamente que verifique su propio trabajo (correr tests, abrir el navegador, revisar el diff) antes de darlo por terminado. No lo asumas." },
    { cat: "claude", color: "amber", text: "Divide una tarea grande en pasos pequeños y verificables en vez de un solo prompt gigante. Cada paso chico es más fácil de revisar y corregir a tiempo." },
    { cat: "claude", color: "amber", text: "Usa un subagente independiente para una 'segunda opinión' sobre un cambio riesgoso — no ve tu razonamiento previo, así que su revisión es más objetiva." },
    { cat: "claude", color: "amber", text: "Escribe `@` seguido del nombre de un archivo o carpeta para referenciarlo directamente en el prompt, en vez de describir dónde está." },
    { cat: "claude", color: "amber", text: "Escribe `/` al inicio del prompt para ver todos los comandos slash disponibles: `/clear`, `/compact`, `/init`, `/agents`, entre otros." },
    { cat: "sql", color: "violet", text: "En `psql`, el atajo `\\x` activa el modo expandido: cada columna se muestra en su propia línea, ideal cuando una fila tiene muchas columnas o valores largos." },
    { cat: "sql", color: "violet", text: "`\\timing` en psql muestra cuánto tardó cada consulta. Actívalo cuando estés comparando el efecto real de un índice nuevo." }
  ];

  var catLabel = { git: "GIT", linux: "LINUX", docker: "DOCKER", sql: "SQL / POSTGRES", claude: "CLAUDE CODE" };
  var catColorVar = { accent: "var(--accent)", amber: "var(--amber)", blue: "var(--blue)", violet: "var(--violet)" };

  var tipIdx = Math.floor(Math.random() * TIPS.length);
  var tipTextEl = document.getElementById("tipText");
  var tipCatEl = document.getElementById("tipCat");
  var tipCounter = document.getElementById("tipCounter");
  var tipDots = document.getElementById("tipDots");
  var tipTimer = null;
  var typingActive = false;

  TIPS.forEach(function (_, i) {
    var d = document.createElement("span");
    d.className = "d";
    tipDots.appendChild(d);
  });

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function renderTip(instant) {
    var t = TIPS[tipIdx];
    tipCatEl.textContent = catLabel[t.cat];
    tipCatEl.style.color = catColorVar[t.color];
    tipCatEl.style.borderColor = catColorVar[t.color];

    tipCounter.textContent = pad2(tipIdx + 1) + " / " + pad2(TIPS.length);
    Array.prototype.forEach.call(tipDots.children, function (d, i) {
      d.classList.toggle("active", i === tipIdx);
    });

    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (instant || reduced) {
      tipTextEl.textContent = t.text;
      return;
    }

    typingActive = true;
    var i = 0;
    tipTextEl.textContent = "";
    var cursor = document.createElement("span");
    cursor.className = "tcursor";
    (function step() {
      if (!typingActive) return;
      if (i <= t.text.length) {
        tipTextEl.textContent = t.text.slice(0, i);
        tipTextEl.appendChild(cursor);
        i += 2;
        setTimeout(step, 10);
      } else {
        tipTextEl.textContent = t.text;
      }
    })();
  }

  function goTip(delta) {
    typingActive = false;
    tipIdx = (tipIdx + delta + TIPS.length) % TIPS.length;
    renderTip(false);
    restartAutoRotate();
  }

  function restartAutoRotate() {
    if (tipTimer) clearInterval(tipTimer);
    tipTimer = setInterval(function () {
      typingActive = false;
      tipIdx = (tipIdx + 1) % TIPS.length;
      renderTip(false);
    }, 9000);
  }

  document.getElementById("tipPrev").addEventListener("click", function () { goTip(-1); });
  document.getElementById("tipNext").addEventListener("click", function () { goTip(1); });

  renderTip(true);
  restartAutoRotate();

  /* ---------------- CHEATSHEETS ---------------- */
  var DATA = {
    git: [
      { grp: "Empezar y guardar", items: [

        ["Entra en un loop o repite el mismo error", "Corta con Ctrl+C, aclara la restricción que falta y vuelve a intentar"],
        ["Cambió código que no debía tocar", "Usa /rewind o revisa el diff con git antes de aceptar, y sé explícito sobre el alcance"],
        ["Pide permiso para algo que no esperabas", "Revisa /permissions — puede que el modo actual sea más amplio de lo que crees"],
        ["No encuentra un archivo o símbolo", "Dale la ruta exacta con @ en vez de describirla de memoria"],
        ["El plan no coincide con lo que querías", "Corrígelo ahí mismo antes de que empiece a escribir código, no después"],
        ["Quieres reproducir un bug reportado", "Pega el mensaje de error completo, no un resumen — los detalles importan"]
      ]}
    ]
  };

  var tabbar = document.getElementById("tabbar");
  var panelHost = document.getElementById("panelHost");
  var filterInput = document.getElementById("filterInput");
  var currentTab = "git";

  function renderPanel(tabKey) {
    var groups = DATA[tabKey];
    var panel = document.createElement("div");
    panel.className = "panel active";
    panel.dataset.tab = tabKey;

    groups.forEach(function (g) {
      var grpEl = document.createElement("div");
      grpEl.className = "grp";
      grpEl.dataset.cat = tabKey;

      var title = document.createElement("div");
      title.className = "grp-title";
      title.textContent = g.grp;
      grpEl.appendChild(title);

      var list = document.createElement("div");
      list.className = "cmd-list";

      g.items.forEach(function (pair) {
        var row = document.createElement("div");
        row.className = "cmd-row";
        row.dataset.search = (pair[0] + " " + pair[1]).toLowerCase();

        var code = document.createElement("div");
        code.className = "cmd-code";
        code.textContent = pair[0];

        var desc = document.createElement("div");
        desc.className = "cmd-desc";
        desc.textContent = pair[1];

        row.appendChild(code);
        row.appendChild(desc);
        list.appendChild(row);
      });

      grpEl.appendChild(list);
      panel.appendChild(grpEl);
    });

    panelHost.innerHTML = "";
    panelHost.appendChild(panel);
    applyFilter();
  }

  function applyFilter() {
    var q = filterInput.value.trim().toLowerCase();
    var rows = panelHost.querySelectorAll(".cmd-row");
    var groups = panelHost.querySelectorAll(".grp");

    rows.forEach(function (r) {
      var match = !q || r.dataset.search.indexOf(q) !== -1;
      r.classList.toggle("hidden", !match);
    });

    groups.forEach(function (g) {
      var visible = g.querySelectorAll(".cmd-row:not(.hidden)").length;
      g.style.display = visible === 0 ? "none" : "";
    });
  }

  tabbar.addEventListener("click", function (e) {
    var btn = e.target.closest(".tabbtn");
    if (!btn) return;
    Array.prototype.forEach.call(tabbar.children, function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    currentTab = btn.dataset.tab;
    filterInput.value = "";
    renderPanel(currentTab);
  });

  filterInput.addEventListener("input", applyFilter);

  function renderCounts() {
    Object.keys(DATA).forEach(function (key) {
      var total = DATA[key].reduce(function (sum, g) { return sum + g.items.length; }, 0);
      var el = document.getElementById("cnt-" + key);
      if (el) el.textContent = total;
    });
  }
  renderCounts();

  renderPanel(currentTab);
})();
</script>
